<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#eeebc2"/>
  <!-- Figura de acceso universal -->
  <g transform="translate(200 215)">
    <circle r="150" fill="#01528a"/>
    <circle cy="-92" r="16" fill="#ffffff"/>
    <path d="M-92-50q92 24 184 0" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M0-45v50" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M0 5l-44 90M0 5l44 90" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- Principios WCAG -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="400" y="110" font-size="24" font-weight="bold" fill="#010135">Los 4 principios de WCAG</text>
    <g>
      <rect x="400" y="135" width="330" height="50" rx="10" fill="#ffffff" stroke="#01528a" stroke-width="3"/>
      <text x="420" y="168" font-size="20" fill="#010135">1. Perceptible</text>
      <rect x="400" y="200" width="330" height="50" rx="10" fill="#ffffff" stroke="#0096d3" stroke-width="3"/>
      <text x="420" y="233" font-size="20" fill="#010135">2. Operable</text>
      <rect x="400" y="265" width="330" height="50" rx="10" fill="#ffffff" stroke="#c7bfaa" stroke-width="3"/>
      <text x="420" y="298" font-size="20" fill="#010135">3. Comprensible</text>
      <rect x="400" y="330" width="330" height="50" rx="10" fill="#ffffff" stroke="#010135" stroke-width="3"/>
      <text x="420" y="363" font-size="20" fill="#010135">4. Robusto</text>
    </g>
  </g>
</svg>
